(function(root){
  'use strict';
  function day(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
  function addDays(d,n){const date=new Date(d+'T12:00:00');date.setDate(date.getDate()+n);return day(date);}
  function empty(){return {seen:0,stage:0,lapses:0,due:null,lastDay:null,lastCorrect:null};}
  function record(previous,correct,today=day()){
    const p={...empty(),...previous};
    const stage=correct ? (p.lastDay===today && p.lastCorrect===true ? p.stage : Math.min(4,p.stage+1)) : 0;
    const intervals=[0,1,2,4,7];
    return {...p,seen:p.seen+1,stage,lapses:p.lapses+(correct?0:1),due:addDays(today,intervals[stage]),lastDay:today,lastCorrect:correct};
  }
  function normalize(s){return String(s).toLowerCase().trim().replace(/[–—−]/g,'-').replace(/\s+/g,' ').replace(/\s*-\s*/g,'-');}
  function answers(word){
    if(word.en==='(aero)/(air)plane')return ['aeroplane','airplane','plane'];
    if(word.en==='hear-heard')return ['hear-heard','hear heard'];
    if(word.en==='wait (for)')return ['wait','wait for','wait (for)'];
    if(word.en==='ask … to …')return ['ask to','ask ... to ...','ask … to …','ask somebody to','ask sb to','ask sb. to'];
    return [word.en];
  }
  function matches(word,value){if(word.en==='Brazil')return String(value).trim()==='Brazil';return answers(word).some(s=>normalize(s)===normalize(value));}
  function isMistake(s){return !!s && s.lapses>0 && s.stage<3;}
  function shuffle(list,rng=Math.random){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function dailyQueue(words,records,today=day()){
    const due=words.filter(w=>records[w.id]?.seen && records[w.id].due<=today).sort((a,b)=>records[a.id].due.localeCompare(records[b.id].due));
    const fresh=words.filter(w=>!records[w.id]?.seen);
    const selected=due.slice(0,6);
    selected.push(...fresh.slice(0,12-selected.length));
    if(selected.length<12)selected.push(...due.slice(6,6+12-selected.length));
    return shuffle(selected);
  }
  root.MaimaiCore={day,addDays,empty,record,normalize,answers,matches,isMistake,shuffle,dailyQueue};
})(typeof window!=='undefined'?window:globalThis);

(function(){
