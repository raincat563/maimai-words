<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="麦麦的每周词表：点击听英音，原词彩色拼读。">
  <title>麦麦单词</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/fflate-0.8.2.js" defer></script>
  <script src="./docx.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="page">
    <header>
      <h1>麦麦单词</h1>
      <div class="tools">
        <label class="sr-only" for="week-select">选择每周词表</label>
        <select id="week-select" disabled><option>加载中…</option></select>
        <span id="local-tag" class="local-tag" hidden>本机</span>
        <details id="manage-menu" class="manage-menu">
          <summary aria-label="词表管理">⋯</summary>
          <div class="menu-items">
            <button id="import-open">导入词表</button>
            <button id="backup" disabled>备份词表</button>
          </div>
        </details>
      </div>
    </header>
    <p id="voice-status" class="notice" role="status" hidden></p>
    <div id="notice" class="notice" role="status" hidden></div>
    <main id="word-list" class="word-list" aria-label="本周全部单词" aria-busy="true"><p class="loading">加载中…</p></main>
  </div>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <div class="dialog-top"><h2 id="import-title">导入词表</h2><button class="close-button" data-close="import-dialog" aria-label="关闭导入窗口">×</button></div>
    <label for="word-file">选择 Word（.docx）或词表备份（.json）</label>
    <input id="word-file" type="file" accept=".docx,.json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/json">
    <p class="note">Word 使用“英文｜中文”表格，按原顺序追加。</p>
    <div id="import-preview" hidden>
      <label for="import-name">词表名称</label>
      <input id="import-name" class="field" maxlength="60" placeholder="例如：第 2 周">
      <div id="preview-list" class="preview-list"></div>
      <p id="preview-count" class="note"></p>
      <button class="primary-button" id="import-confirm">导入</button>
    </div>
    <p id="import-error" class="form-error" role="alert" hidden></p>
    <p class="storage-note">网页导入仅保存在本机浏览器。跨设备共享需更新网站，也可用备份迁移。</p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
